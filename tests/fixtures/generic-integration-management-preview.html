<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generic Integration Management Preview</title>
<style>:root{font-family:system-ui,"Sarabun",sans-serif;color:#16204a;background:#f5f6fa}body{margin:0}.top{background:#1c2b64;color:#fff;padding:18px 16px}.top h1{margin:0;font-size:22px}.wrap{padding:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px #14204a18}input,select,button{font:inherit;padding:10px;border:1px solid #ccd1df;border-radius:8px;box-sizing:border-box;min-height:44px}button{background:#1c2b64;color:#fff;border:0}.secondary{background:#eef1fa;color:#1c2b64}.danger{background:#9b2c2c}.muted{color:#667085}dialog{border:0;border-radius:14px}dialog::backdrop{background:#10182899}button:disabled{opacity:.55}</style>
<link rel="stylesheet" href="../../liff-app/system-admin/care-operations-ui.css"></head>
<body><header class="top"><h1>PHIMOR System Admin</h1></header><main class="wrap">
<section class="card care-ops" id="careOperationsPanel" aria-labelledby="careOperationsTitle"><div class="care-ops__header"><div><h2 id="careOperationsTitle">ศูนย์และระบบเชื่อมต่อ</h2><p class="muted">ตั้งค่าระบบเชื่อมต่อโดยไม่เปิดดูข้อมูลสุขภาพ</p></div><button type="button" class="secondary" id="careOperationsRefresh">รีเฟรชงานระบบ</button></div>
<nav class="care-ops__tabs" aria-label="ส่วนงาน Care Infrastructure"><button type="button" class="care-ops__tab" data-care-ops-tab="overview">องค์กรและศูนย์</button><button type="button" class="care-ops__tab" data-care-ops-tab="capabilities">ความสามารถ</button><button type="button" class="care-ops__tab" data-care-ops-tab="integrations" aria-selected="true">ระบบเชื่อมต่อ</button><button type="button" class="care-ops__tab" data-care-ops-tab="pending">ผู้พักรอเชื่อม</button><button type="button" class="care-ops__tab" data-care-ops-tab="groups">กลุ่ม LINE</button></nav>
<div class="care-ops__content" id="careOperationsContent" aria-live="polite"></div></section></main>
<script src="../../liff-app/system-admin/care-operations-ui.js"></script><script>
const client={integrationClientId:'INT-FICTIONAL',organizationId:'ORG-FICTIONAL',clientCode:'hhs-pilot',displayName:'HHS Pilot',sourceSystem:'HHS',status:'suspended',organization:{organizationId:'ORG-FICTIONAL',displayName:'Fictional Organization',status:'active',organizationType:'external_care_center'},organizationName:'Fictional Organization',centers:[{centerId:'CTR-FICTIONAL',name:'Fictional Pilot Center',status:'active',createdAt:'2026-08-30T02:00:00Z'}],eventScopes:['care.daily_report.finalized'],credentials:[{credentialId:'INTK-FICTIONAL',publicPrefix:'abcd1234efgh5678',status:'active',createdAt:'2026-08-30T02:10:00Z',lastUsedAt:null}],activeCredentialCount:1,lastUsedAt:null,mappingCounts:{centers:1,activeCenters:1,residents:1,mappedResidents:1},readiness:{state:'suspended',label:'ระงับการใช้งาน',configurationComplete:true,residentMappingRecommended:false,checks:{organization:true,centerScope:true,eventScope:true,activeCredential:true,externalCenterMapping:true,externalResidentMapping:true,clientActive:false}}};
const response=async(path,opt={})=>{if(path==='/api/admin/platform/organizations')return{organizations:[client.organization]};if(path.includes('/organizations/ORG-FICTIONAL/centers'))return{centers:[{centerId:'CTR-FICTIONAL',name:'Fictional Pilot Center',status:'active'}]};if(path.includes('/capabilities'))return{capabilities:[{centerId:'CTR-FICTIONAL',capabilityKey:'vital_signs_v1',enabled:true},{centerId:'CTR-FICTIONAL',capabilityKey:'daily_care_v1',enabled:true}]};if(path.includes('/organizations/ORG-FICTIONAL/integration-clients'))return{integrationClients:[client]};if(path.endsWith('/integration-clients/INT-FICTIONAL'))return{integrationClient:client};if(path.includes('/external-centers?'))return{items:[{externalCenterId:'HHS_BRANCH_TEST',centerId:'CTR-FICTIONAL',centerName:'Fictional Pilot Center',centerStatus:'active',status:'active',createdAt:'2026-08-30T02:15:00Z',deactivatedAt:null}],pagination:{page:1,limit:50,total:1,totalPages:1}};if(path.includes('/external-subjects?'))return{items:[{externalCenterId:'HHS_BRANCH_TEST',externalResidentId:'HHS_RESIDENT_TEST',centerId:'CTR-FICTIONAL',centerName:'Fictional Pilot Center',residentDisplayName:'Fictional Resident',room:'A101',residentStatus:'active',mappingStatus:'mapped',careProfileReady:true,createdAt:'2026-08-30T02:20:00Z'}],pagination:{page:1,limit:50,total:1,totalPages:1}};if(path.includes('/resident-options'))return{residents:[{residentId:'RES-FICTIONAL',displayName:'Fictional Resident',room:'A101',careProfileLinked:true}]};if(path.includes('/pending-subjects'))return{items:[]};if(path.includes('/integration-events/status'))return{items:[]};if(path.includes('/status')&&opt.method==='PATCH'){client.status=JSON.parse(opt.body).status;client.readiness.label=client.status==='active'?'พร้อมรับข้อมูล':'ระงับการใช้งาน';client.readiness.checks.clientActive=client.status==='active';return{integrationClient:client}};if((path.endsWith('/credentials')||path.endsWith('/rotate'))&&opt.method==='POST')return{credential:client.credentials[0],token:'pim_int_fictional000000.DUMMY_TEST_SECRET_NOT_REAL_1234567890'};return{};};
const controller=window.PhimorCareOperationsUI.createController({doc:document,request:response,confirmAction:async()=>true});controller.setTab('integrations');controller.load();careOperationsRefresh.addEventListener('click',()=>controller.load());
</script></body></html>
