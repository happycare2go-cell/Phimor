<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ผู้ดูแลระบบพี่หมอ</title>
  <style>
    :root{font-family:system-ui,"Sarabun",sans-serif;color:#16204a;background:#f5f6fa}body{margin:0}.top{background:#1c2b64;color:#fff;padding:18px 5vw}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #14204a18}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd1df;border-radius:8px;box-sizing:border-box}button{background:#1c2b64;color:#fff;border:0;cursor:pointer}.secondary{background:#eef1fa;color:#1c2b64}.danger{background:#9b2c2c}.muted{color:#667085}.ok{color:#087a55}.bad{color:#b42318}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.center{border-top:1px solid #e7e9f0;padding:14px 0}.center:first-child{border-top:0}.pill{border-radius:99px;padding:3px 9px;background:#eef1fa;font-size:12px}dialog{border:0;border-radius:14px;width:min(900px,92vw);max-height:85vh;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:8px;vertical-align:top}@media(max-width:600px){.wrap{padding:12px}table{font-size:12px}}
  </style>
</head>
<body>
  <div class="top"><h1>ผู้ดูแลระบบพี่หมอ</h1><div>จัดการสาขา สิทธิแพ็กเกจ และตรวจสอบ Care Profile</div></div>
  <main class="wrap">
    <section class="card" id="login">
      <h2>ยืนยันผู้ดูแลระบบครั้งแรก</h2><p class="muted">ระบบตรวจบัญชี LINE จาก LIFF อัตโนมัติ กรุณาใส่ ADMIN API Key ครั้งเดียวเพื่อผูกบัญชี LINE นี้เป็นผู้ดูแลระบบ</p>
      <div class="row"><input id="apiKey" type="password" autocomplete="current-password" placeholder="ADMIN API Key" style="flex:1"><button onclick="bootstrapAdmin()">ยืนยันบัญชีนี้</button></div><p id="loginError" class="bad"></p>
    </section>
    <section id="app" hidden>
      <div class="card row"><strong style="flex:1">สาขาทั้งหมด</strong><button class="secondary" onclick="loadCenters()">รีเฟรช</button><button class="danger" onclick="logout()">ออกจากระบบ</button></div>
      <div class="card"><div id="summary" class="grid"></div></div>
      <div class="card"><input id="search" placeholder="ค้นหาชื่อศูนย์/เจ้าของ" oninput="render()" style="width:100%"><div id="centers"></div></div>
    </section>
  </main>
  <dialog id="detail"><div class="row"><h2 id="detailTitle" style="flex:1"></h2><button class="secondary" onclick="detail.close()">ปิด</button></div><div id="detailBody"></div></dialog>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const BACKEND_URL=window.PHIMOR_BACKEND_URL||'https://phimor-backend.onrender.com';let centers=[];
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let idToken='';
    async function api(path,opt={}){const r=await fetch(BACKEND_URL+path,{...opt,headers:{'Content-Type':'application/json',...(idToken?{'Authorization':`Bearer ${idToken}`} : {}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.message||d.error||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
    async function bootstrapAdmin(){loginError.textContent='';const adminKey=document.querySelector('#apiKey').value.trim();if(!adminKey){loginError.textContent='กรุณาใส่ ADMIN API Key';return}try{await api('/api/admin/bootstrap',{method:'POST',headers:{'X-Admin-Key':adminKey},body:'{}'});document.querySelector('#apiKey').value='';await enterAdmin()}catch(e){loginError.textContent=e.message}}
    async function enterAdmin(){await loadCenters();login.hidden=true;app.hidden=false}
    function logout(){if(window.liff?.isLoggedIn())liff.logout();location.reload()}
    async function loadCenters(){const d=await api('/api/admin/centers');centers=d.centers;render()}
    function status(c){const s=c.subscription||{};if(c.status!=='active')return '<span class="pill bad">ระงับ</span>';if(!s.allowed)return `<span class="pill bad">${esc(s.code)}</span>`;if(s.needsConfiguration)return '<span class="pill bad">ยังไม่กำหนดแพ็กเกจ</span>';return `<span class="pill ok">เหลือ ${esc(s.remainingDays)} วัน</span>`}
    function render(){const q=(search.value||'').toLowerCase();const rows=centers.filter(c=>(c.name+' '+c.ownerLineId).toLowerCase().includes(q));const active=centers.filter(c=>c.subscription?.allowed).length;const exp=centers.filter(c=>c.subscription?.remainingDays<=3).length;summary.innerHTML=`<div><b>${centers.length}</b><div class="muted">สาขาทั้งหมด</div></div><div><b>${active}</b><div class="muted">มีสิทธิใช้งาน</div></div><div><b>${exp}</b><div class="muted">หมดอายุภายใน 3 วัน</div></div>`;document.querySelector('#centers').innerHTML=rows.map(c=>`<div class="center"><div class="row"><div style="flex:1"><b>${esc(c.name)}</b> ${status(c)}<div class="muted">${esc(c.address||'-')} · ผู้พัก active ${esc(c.activeResidentCount)}</div><div class="muted">เริ่ม ${esc(c.subscriptionStartAt?new Date(c.subscriptionStartAt).toLocaleDateString('th-TH'):'ยังไม่กำหนด')} — หมด ${esc(c.subscriptionEndAt?new Date(c.subscriptionEndAt).toLocaleDateString('th-TH'):'ยังไม่กำหนด')}</div></div><button onclick="editSubscription('${esc(c.centerId)}')">ปรับสิทธิ</button><button class="secondary" onclick="openDetail('${esc(c.centerId)}')">รายละเอียด/Care Profile</button></div></div>`).join('')||'<p class="muted">ไม่พบข้อมูล</p>'}
    async function editSubscription(id){const c=centers.find(x=>x.centerId===id);const start=prompt('วันเริ่มใช้ (YYYY-MM-DD)',(c.subscriptionStartAt||new Date().toISOString()).slice(0,10));if(!start)return;const end=prompt('วันหมดอายุ (YYYY-MM-DD)',(c.subscriptionEndAt||'').slice(0,10));if(!end)return;const type=prompt('ประเภทแพ็กเกจ monthly / annual / custom',c.packageType||'custom')||'custom';if(!confirm(`ยืนยันให้ ${c.name} ใช้ได้ถึง ${end}\nระบบจะส่ง LINE แจ้งเจ้าของศูนย์`))return;try{await api(`/api/admin/centers/${encodeURIComponent(id)}/subscription`,{method:'PATCH',body:JSON.stringify({startsAt:start+'T00:00:00+07:00',expiresAt:end+'T23:59:59+07:00',packageType:type})});await loadCenters();alert('อัปเดตและส่งแจ้งเตือนแล้ว')}catch(e){alert(`บันทึกไม่สำเร็จ: ${e.message}`)}}
    async function openDetail(id){const [d,p]=await Promise.all([api(`/api/admin/centers/${encodeURIComponent(id)}`),api(`/api/admin/centers/${encodeURIComponent(id)}/care-profiles`)]);detailTitle.textContent=d.center.name;detailBody.innerHTML=`<p>เจ้าของ: ${esc(d.center.owner_line_id)} · พนักงาน ${d.staff.length} คน · ผู้พัก ${d.residents.length} คน</p><table><thead><tr><th>ผู้พัก</th><th>สถานะ</th><th>Care Profile</th><th>ข้อมูลสำคัญ</th></tr></thead><tbody>${p.rows.map(x=>`<tr><td>${esc(x.resident.full_name)}<br><span class="muted">ห้อง ${esc(x.resident.room||'-')}</span></td><td>${esc(x.resident.status)}</td><td>${esc(x.profile?.patient_name||'ยังไม่ผูก')}<br><span class="muted">${esc(x.profile?.care_profile_id||'')}</span></td><td>${x.profile?`กรุ๊ปเลือด ${esc(x.profile.blood_type||'-')}<br>โรคประจำตัว ${esc((x.profile.chronic_conditions||[]).join(', ')||'-')}<br>แพ้ยา ${esc(x.profile.drug_allergies||'-')}`:'-'}</td></tr>`).join('')}</tbody></table>`;detail.showModal()}
    async function start(){try{const config=await fetch(BACKEND_URL+'/config/liff').then(r=>r.json());if(!config.systemAdminLiffId)throw new Error('ยังไม่ได้ตั้งค่า LIFF_ID_SYSTEM_ADMIN ใน Render');await liff.init({liffId:config.systemAdminLiffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}idToken=liff.getIDToken()||'';if(!idToken)throw new Error('LINE ไม่ส่ง ID Token กรุณาตรวจว่า LIFF เปิด scope openid');try{await enterAdmin()}catch(e){if(e.status!==401)throw e;login.hidden=false}}catch(e){loginError.textContent=e.message}}
    start();
  </script>
</body></html>
