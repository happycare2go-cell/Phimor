<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปิดระบบศูนย์ดูแลพี่หมอ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; padding: 20px; text-align: center; background-color: #F8F7F3;}
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 50px; max-width: 400px; margin-left: auto; margin-right: auto;}
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background-color: #1C2B64; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #1C2B64;">ลงทะเบียนศูนย์ใหม่</h2>
        <p style="color: #5F5E5A; margin-bottom: 20px;">ระบบจะดึง LINE ID ของคุณเพื่อผูกเป็นเจ้าของศูนย์โดยอัตโนมัติ</p>
        <input type="text" id="centerName" placeholder="ระบุชื่อศูนย์ดูแลของคุณ">
        <input type="text" id="address" placeholder="ที่อยู่/จุดรับของสาขา">
        <input type="tel" id="contactPhone" placeholder="เบอร์ติดต่อเจ้าของศูนย์">
        <button onclick="registerCenter()">ยืนยันเปิดศูนย์</button>
        <p id="status" style="color: #0F6E56; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        // ★ Dev: เปลี่ยน URL เป็น Backend ของคุณ
        const BACKEND_URL = 'https://phimor-backend.onrender.com';
        
        async function main() {
            // ★ Dev: ใส่ LIFF ID สำหรับหน้าลงทะเบียน
            await liff.init({ liffId: '2011043561-cC9jBw5t' });
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        }

        async function registerCenter() {
            const centerName = document.getElementById('centerName').value;
            const address = document.getElementById('address').value.trim();
            const contactPhone = document.getElementById('contactPhone').value.trim();
            if(!centerName || !address || !contactPhone) return alert('กรุณากรอกชื่อ ที่อยู่ และเบอร์ติดต่อให้ครบ');

            document.getElementById('status').innerText = 'กำลังสร้างศูนย์...';
            document.getElementById('status').style.color = '#DEB14E';

            try {
                const idToken = liff.getIDToken();
                const profile = await liff.getProfile();

                const response = await fetch(`${BACKEND_URL}/api/external/register-center`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ centerName, address, contactPhone, idToken, lineUserId: profile.userId })
                });

                const data = await response.json();
                if(data.success) {
                    document.getElementById('status').style.color = '#0F6E56';
                    document.getElementById('status').innerText = '✅ สร้างศูนย์สำเร็จ! คุณสามารถปิดหน้านี้ได้เลย';
                    setTimeout(() => { liff.closeWindow(); }, 2500);
                } else {
                    document.getElementById('status').style.color = 'red';
                    document.getElementById('status').innerText = '❌ เกิดข้อผิดพลาด: ' + data.error;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').style.color = 'red';
                document.getElementById('status').innerText = '❌ ไม่สามารถเชื่อมต่อระบบได้ (โปรดตรวจสอบ CORS)';
            }
        }

        main();
    </script>
</body>
</html>
