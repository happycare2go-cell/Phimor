<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปิดระบบศูนย์ดูแลพี่หมอ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/mascot-ui.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; padding: 20px; text-align: center; background-color: #F8F7F3;}
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 50px; max-width: 400px; margin-left: auto; margin-right: auto;}
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background-color: #1C2B64; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container">
        <div class="mascot-callout mascot-callout--compact" style="text-align:left">
            <div class="mascot-callout__copy"><span class="mascot-callout__eyebrow">เริ่มต้นใช้งาน</span><h1 class="mascot-callout__title">เปิดสาขาใหม่ แล้วพี่หมอจะช่วยจัดระบบให้ครับ</h1><p class="mascot-callout__text">บัญชี LINE ที่ลงทะเบียนจะได้รับบทบาทเจ้าของสาขาโดยอัตโนมัติ</p></div>
            <img class="mascot-callout__image" src="../assets/mascot/phimor-important.png" alt="">
        </div>
        <h2 style="color: #1C2B64;">ลงทะเบียนศูนย์ใหม่</h2>
        <p style="color: #5F5E5A; margin-bottom: 20px;">ระบบจะดึง LINE ID ของคุณเพื่อผูกเป็นเจ้าของศูนย์โดยอัตโนมัติ</p>
        <input type="text" id="centerName" required autocomplete="organization" placeholder="ระบุชื่อศูนย์ดูแลของคุณ">
        <input type="text" id="address" required autocomplete="street-address" placeholder="ที่อยู่/จุดรับของสาขา">
        <input type="tel" id="contactPhone" required inputmode="tel" autocomplete="tel" placeholder="เบอร์ติดต่อเจ้าของศูนย์">
        <button id="registerButton" onclick="registerCenter()">ยืนยันเปิดศูนย์</button>
        <div id="statusBox" role="status" aria-live="polite" class="mascot-callout mascot-callout--compact" style="display:none;text-align:left;margin-top:16px">
            <div class="mascot-callout__copy"><span class="mascot-callout__eyebrow" id="statusLabel">สถานะ</span><p id="status" class="mascot-callout__title" style="font-size:15px"></p></div>
            <img id="statusMascot" class="mascot-callout__image" src="../assets/mascot/phimor-review.png" alt="">
        </div>
    </div>

    <script>
        // ★ Dev: เปลี่ยน URL เป็น Backend ของคุณ
        const BACKEND_URL = 'https://phimor-backend.onrender.com';
        
        async function main() {
            const configResponse = await fetch(`${BACKEND_URL}/config/liff`);
            const config = await configResponse.json();
            if (!config.registerLiffId) throw new Error('ระบบยังไม่ได้ตั้งค่า LIFF_ID_REGISTER');
            await liff.init({ liffId: config.registerLiffId });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
        }

        async function registerCenter() {
            const centerName = document.getElementById('centerName').value;
            const address = document.getElementById('address').value.trim();
            const contactPhone = document.getElementById('contactPhone').value.trim();
            if(!centerName || !address || !contactPhone) return showStatus('กรุณากรอกชื่อ ที่อยู่ และเบอร์ติดต่อให้ครบ',true);
            if(!/^[0-9+() -]{8,20}$/.test(contactPhone)) return showStatus('กรุณาตรวจสอบเบอร์โทรศัพท์อีกครั้ง',true);
            const button=document.getElementById('registerButton');button.disabled=true;button.innerText='กำลังสร้างศูนย์...';

            document.getElementById('statusBox').style.display = 'flex';
            document.getElementById('status').innerText = 'กำลังสร้างศูนย์...';
            document.getElementById('statusLabel').innerText = 'กำลังตรวจสอบ';
            document.getElementById('statusMascot').src = '../assets/mascot/phimor-review.png';
            document.getElementById('status').style.color = '#DEB14E';

            try {
                const idToken = liff.getIDToken();
                const profile = await liff.getProfile();

                const response = await fetch(`${BACKEND_URL}/api/external/register-center`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ centerName, address, contactPhone, idToken, lineUserId: profile.userId })
                });

                const data = await response.json();
                if(data.success) {
                    document.getElementById('status').style.color = '#0F6E56';
                    document.getElementById('status').innerText = '✅ ลงทะเบียนศูนย์แล้ว กรุณารอเจ้าหน้าที่กำหนดและเปิดสิทธิแพ็กเกจก่อนเริ่มใช้งาน';
                    document.getElementById('statusLabel').innerText = 'ลงทะเบียนสำเร็จ';
                    document.getElementById('statusMascot').src = '../assets/mascot/phimor-important.png';
                    setTimeout(() => { liff.closeWindow(); }, 2500);
                } else {
                    document.getElementById('status').style.color = 'red';
                    document.getElementById('status').innerText = '❌ เกิดข้อผิดพลาด: ' + data.error;
                    document.getElementById('statusLabel').innerText = 'ข้อมูลยังไม่สำเร็จ';
                    document.getElementById('statusMascot').src = '../assets/mascot/phimor-important.png';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').style.color = 'red';
                document.getElementById('status').innerText = '❌ เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่';
                document.getElementById('statusBox').style.display = 'flex';
                document.getElementById('statusLabel').innerText = 'เชื่อมต่อไม่สำเร็จ';
                document.getElementById('statusMascot').src = '../assets/mascot/phimor-important.png';
            } finally { const b=document.getElementById('registerButton');b.disabled=false;b.innerText='ยืนยันเปิดศูนย์'; }
        }

        function showStatus(message,isError){document.getElementById('statusBox').style.display='flex';document.getElementById('status').innerText=message;document.getElementById('status').style.color=isError?'#B42318':'#0F6E56';document.getElementById('statusLabel').innerText=isError?'กรุณาตรวจสอบ':'สำเร็จ'}

        main();
    </script>
</body>
</html>
