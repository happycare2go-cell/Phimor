# render.yaml — Blueprint สำหรับ Deploy พี่หมอ Backend ขึ้น Render.com แบบอัตโนมัติ
# ใช้งาน: เข้า https://dashboard.render.com/blueprints → New Blueprint Instance
#         → เชื่อม Repository ที่มีไฟล์นี้ → Render จะอ่านและสร้าง Service ให้เองทั้งหมด

services:
  - type: web
    name: phimor-backend
    runtime: node
    region: singapore          # ใกล้ไทยที่สุดในตัวเลือกของ Render ลด Latency
    plan: starter               # เริ่มจาก Starter พอสำหรับเฟส 1 (8 สาขา) อัปเกรดทีหลังได้
    rootDir: backend
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    # ใช้ readiness เพื่อไม่สลับ traffic มาที่รุ่นใหม่ถ้า DB/Secret สำคัญยังไม่พร้อม
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_API_KEY
        sync: false   # ★ ตั้งเป็นค่าสุ่มยาวๆ ในหน้า Dashboard — ใช้สร้างศูนย์ใหม่ผ่าน /api/admin/centers
      - key: DATABASE_URL
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      # ★ ต้องกรอกค่าจริงในหน้า Dashboard ของ Render หลัง Deploy (ห้ามใส่ค่าจริงในไฟล์นี้)
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LIFF_ID_CENTER_ADMIN
        sync: false
      - key: LIFF_ID_FAMILY
        sync: false
      - key: LIFF_ID_REGISTER
        sync: false
      - key: LIFF_ID_SYSTEM_ADMIN
        sync: false
      - key: LIFF_ID_PHARMACIST
        sync: false
      - key: CONSULTATION_REALTIME_TICKET_SECRET
        sync: false   # Secret แบบสุ่มอย่างน้อย 32 ตัวอักษร ตั้งด้วยมือ ห้ามใส่ค่าใน Git
      - key: CONSULTATION_REALTIME_ALLOWED_ORIGINS
        value: "https://phimor-liff.onrender.com"
      - key: ALLOWED_ORIGINS
        value: "https://phimor-liff.onrender.com"
      - key: PUBLIC_BACKEND_URL
        value: "https://phimor-backend.onrender.com"
      - key: CARE2GO_GROUP_BIND_CODE
        sync: false   # รหัสลับชั่วคราวสำหรับส่งในกลุ่ม Care2Go เพื่อผูกกลุ่มปฏิบัติการ
      - key: GEMINI_API_KEY
        sync: false
      # Ordinary AI remains on Gemini for this release. Clinical Research has
      # an independent server-side provider and remains disabled until commissioned.
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_PROVIDER_CLINICAL_RESEARCH
        value: "openai"
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL_DOCUMENT
        value: "gpt-5.6-luna"
      - key: AI_MODEL_EXPLANATION
        value: "gpt-5.6-terra"
      - key: AI_MODEL_PHARMACIST
        value: "gpt-5.6-terra"
      - key: AI_MODEL_CLINICAL_RESEARCH
        value: "gpt-5.6-sol"
      - key: PHARMACIST_AI_RESEARCH_ENABLED
        value: "false"
      - key: PDF_DOWNLOAD_SECRET
        sync: false
      # Plus payment V1 is manual renewal only. Keep disabled until migration
      # 0015 and controlled Omise test/production configuration are verified.
      - key: PLUS_PAYMENT_ENABLED
        value: "false"
      - key: CONSULTATION_PAYMENT_PROVIDER
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
      - key: OMISE_WEBHOOK_SECRET
        sync: false
      - key: AI_NAME_MATCH_THRESHOLD
        value: "0.82"
      - key: CARD_EXPIRY_HOURS
        value: "24"
      - key: CARD_REMINDER_HOURS
        value: "2"
      - key: IMAGE_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: INVITE_EXPIRY_DAYS
        value: "30"
      - key: CARE2GO_UNAVAILABLE_DEADLINE_HOURS
        value: "12"
      - key: REQUIRE_STAFF_APPROVAL
        value: "true"
      - key: REQUIRE_CARE2GO_OPS_BINDING
        value: "true"
      - key: MEDICAL_IMAGE_RETENTION_DAYS
        value: "90"
  - type: web
    name: phimor-liff
    runtime: static
    rootDir: liff-app
    buildCommand: node scripts/write-runtime-config.js
    staticPublishPath: .
    envVars:
      - key: PUBLIC_BACKEND_URL
        value: "https://phimor-backend.onrender.com"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
